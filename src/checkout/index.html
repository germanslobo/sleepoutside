<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <!-- Header dinámico -->
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout-section">
        <h2>Review & Place your Order</h2>
        
        <div class="checkout-container">
          <!-- Formulario de Checkout -->
          <form id="checkout-form">
            <fieldset>
              <legend>Shipping Address</legend>
              <div class="checkout__name">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required />
              </div>
              <div class="checkout__name">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required />
              </div>
              <div>
                <label for="street">Street Address</label>
                <input type="text" id="street" name="street" required />
              </div>
              <div>
                <label for="city">City</label>
                <input type="text" id="city" name="city" required />
              </div>
              <div>
                <label for="state">State</label>
                <input type="text" id="state" name="state" required />
              </div>
              <div>
                <label for="zip">Zip Code</label>
                <input type="text" id="zip" name="zip" required />
              </div>
            </fieldset>

            <fieldset>
              <legend>Payment Information</legend>
              <div>
                <label for="cardNumber">Credit Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234123412341234" required />
              </div>
              <div>
                <label for="expiration">Expiration Date</label>
                <input type="text" id="expiration" name="expiration" placeholder="MM/YY" required />
              </div>
              <div>
                <label for="code">Security Code (CVV)</label>
                <input type="text" id="code" name="code" placeholder="123" required />
              </div>
            </fieldset>

            <!-- Order Summary Display -->
            <fieldset class="checkout-summary">
              <legend>Order Summary</legend>
              <ul>
                <li>Subtotal: <span id="subtotal">$0.00</span></li>
                <li>Tax (6%): <span id="tax">$0.00</span></li>
                <li>Shipping Estimate: <span id="shipping">$0.00</span></li>
                <li><strong>Order Total: <span id="orderTotal">$0.00</span></strong></li>
              </ul>
            </fieldset>

            <button id="checkoutSubmit" type="submit" class="button">Submit Order</button>
          </form>
        </div>
      </section>
    </main>

    <!-- Footer dinámico -->
    <footer id="main-footer"></footer>
  </body>
</html>
