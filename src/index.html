<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SleepOutside | Home</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header dinámico -->
  <header class="divider" id="main-header"></header>

  <!-- Contenido principal de la página -->
  <main class="divider">
    <div class="hero">
      <img src="/images/banner-sm.jpg" alt="image of a high mountain lake">
      <div class="logo">
        <img src="/images/noun_Tent_2517.svg" alt="tent image">
        <p>Top-Quality Tents & Gear</p>
      </div>
    </div>
    <section class="products">
      <h2>Top Products</h2>
      <!-- Contenedor que busca main.js para mostrar los productos -->
      <ul class="product-list"></ul>
    </section>
  </main>

  <!-- Footer dinámico -->
  <footer id="main-footer"></footer>

  <!-- ¡CRUCIAL! Esta etiqueta es la que enciende el motor de JavaScript -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
